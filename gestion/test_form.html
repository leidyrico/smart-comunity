<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Form</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="text"], input[type="password"] { 
            width: 300px; 
            padding: 8px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
        }
        button { 
            background: #007cba; 
            color: white; 
            padding: 10px 20px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
        }
        button:hover { background: #005a87; }
        .result { 
            margin-top: 20px; 
            padding: 10px; 
            background: #f0f0f0; 
            border-radius: 4px; 
        }
    </style>
</head>
<body>
    <h1>Prueba de Formulario de Login</h1>
    
    <form id="loginForm" action="http://localhost:8000/login" method="POST">
        <input type="hidden" name="_token" value="{{ csrf_token() }}" id="csrfToken">
        
        <div class="form-group">
            <label for="user">Usuario:</label>
            <input type="text" id="user" name="user" value="admintest@gmail.com" required>
        </div>
        
        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" value="admintest" required>
        </div>
        
        <div class="form-group">
            <label>
                <input type="checkbox" name="remember" value="1"> Recordarme
            </label>
        </div>
        
        <button type="submit">Iniciar Sesión</button>
    </form>
    
    <div class="result" id="result" style="display: none;">
        <h3>Resultado:</h3>
        <div id="resultContent"></div>
    </div>
    
    <script>
        // Obtener token CSRF del servidor
        fetch('http://localhost:8000/login')
            .then(response => response.text())
            .then(html => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const csrfToken = doc.querySelector('meta[name="csrf-token"]')?.getAttribute('content');
                if (csrfToken) {
                    document.getElementById('csrfToken').value = csrfToken;
                    console.log('CSRF Token obtenido:', csrfToken);
                }
            })
            .catch(error => {
                console.error('Error obteniendo CSRF token:', error);
            });
        
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const result = document.getElementById('result');
            const resultContent = document.getElementById('resultContent');
            
            console.log('Enviando formulario...');
            console.log('Datos:', Object.fromEntries(formData));
            
            fetch(this.action, {
                method: 'POST',
                body: formData,
                credentials: 'same-origin'
            })
            .then(response => {
                console.log('Respuesta recibida:', response.status, response.statusText);
                return response.text();
            })
            .then(data => {
                result.style.display = 'block';
                resultContent.innerHTML = '<pre>' + data.substring(0, 1000) + '</pre>';
                console.log('Respuesta completa:', data);
            })
            .catch(error => {
                result.style.display = 'block';
                resultContent.innerHTML = '<strong>Error:</strong> ' + error.message;
                console.error('Error:', error);
            });
        });
    </script>
</body>
</html>
